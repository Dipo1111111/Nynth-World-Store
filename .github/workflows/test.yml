name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/nynth-ecom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/nynth-ecom/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  edge-functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/nynth-ecom
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --allow-env --allow-net --allow-read supabase/functions