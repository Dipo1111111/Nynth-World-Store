<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 — Nynth World Store</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #0c0c0c;
            color: #ffead0;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }
        .wrap {
            text-align: center;
            padding: 2rem;
        }
        .code {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            margin: 0 0 1rem;
        }
        p {
            margin: 0 0 2rem;
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            opacity: 0.6;
        }
        a {
            color: #ffead0;
            border: 1px solid rgba(255, 234, 208, 0.35);
            padding: 0.9rem 2rem;
            text-decoration: none;
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }
        a:hover {
            background: #ffead0;
            color: #0c0c0c;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <p class="code">404</p>
        <p>This asset was not found</p>
        <a href="/">Back to Nynth World</a>
    </div>
</body>
</html>
