<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 — Nynth World Store</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #0a0a0a;
            color: #EDEAE2;
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, sans-serif;
        }
        .wrap {
            text-align: center;
            padding: 2rem;
            max-width: 32rem;
        }
        .label {
            margin: 0 0 0.75rem;
            font-size: 0.6875rem;
            font-weight: 700;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            opacity: 0.4;
        }
        .code {
            margin: 0 0 1rem;
            font-size: clamp(4rem, 14vw, 7rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1;
        }
        p.body {
            margin: 0 0 2rem;
            font-size: 0.875rem;
            line-height: 1.6;
            opacity: 0.6;
        }
        a {
            display: inline-block;
            color: #0a0a0a;
            background: #EDEAE2;
            padding: 1rem 2rem;
            text-decoration: none;
            font-size: 0.625rem;
            font-weight: 700;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }
        a:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="wrap">
        <p class="label">Error 404</p>
        <p class="code">404</p>
        <p class="body">This page or asset doesn't exist or was moved. Let's get you back to the shop.</p>
        <a href="/">Back to Nynth World</a>
    </div>
</body>
</html>
